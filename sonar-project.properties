sonar.projectKey=chronos-local
sonar.projectName=Chronos (local)
sonar.sourceEncoding=UTF-8

# Tests are co-located with production TypeScript files under src.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/test/**

# Keep generated output, dependencies, and local tool caches out of analysis.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.astro/**,**/.codegraph/**,**/coverage/**,**/artifacts/**,**/.pi/**
