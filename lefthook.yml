pre-commit:
  parallel: false
  piped: true
  commands:
    staged-files-clean:
      priority: 1
      run: >-
        git diff --cached --quiet --diff-filter=ACMR || ( test ! -s $(git rev-parse --git-path info/lefthook-unstaged.patch) || ! git apply --numstat -- $(git rev-parse --git-path info/lefthook-unstaged.patch) | cut -f3- | grep -F -x -f <(git diff --cached --name-only --diff-filter=ACMR) >/dev/null ) || ( printf '%s\n' 'ERROR: staged files have unstaged changes. Stage or revert those changes before committing.'; git apply --numstat -- $(git rev-parse --git-path info/lefthook-unstaged.patch) | cut -f3- | grep -F -x -f <(git diff --cached --name-only --diff-filter=ACMR); false ); status=$?; exit $status; :
    biome:
      glob: '*.{js,mjs,cjs,jsx,ts,tsx,json,jsonc,css}'
      run: npm exec -- biome check --no-errors-on-unmatched {staged_files}
    eslint:
      glob: '*.{js,mjs,cjs,jsx,ts,tsx,astro}'
      run: npm exec -- eslint {staged_files}
    prettier:
      glob: '*.{js,mjs,cjs,jsx,ts,tsx,json,jsonc,css,yml,yaml,astro}'
      run: npm exec -- prettier --check {staged_files}

pre-push:
  parallel: false
  commands:
    quality:
      run: npm run quality:ci
