pre-commit:
  parallel: false
  piped: true
  commands:
    staged-files-clean:
      priority: 1
      run: >-
        bash scripts/staged-files-clean.sh
    biome:
      glob: '*.{js,mjs,cjs,jsx,ts,tsx,json,jsonc,css}'
      run: npm exec -- biome check --no-errors-on-unmatched {staged_files}
    eslint:
      glob: '*.{js,mjs,cjs,jsx,ts,tsx,astro}'
      run: npm exec -- eslint {staged_files}
    prettier:
      glob: '*.{js,mjs,cjs,jsx,ts,tsx,json,jsonc,css,yml,yaml,astro}'
      run: npm exec -- prettier --check {staged_files}

pre-push:
  parallel: false
  commands:
    quality:
      run: npm run quality:ci
